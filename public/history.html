<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Recent History — Local AI Studio</title><link rel="icon" href="/icons/icon.svg"><link rel="stylesheet" href="/history.css"></head>
<body>
  <main class="history-page">
    <header class="history-header"><div><a class="back-link" href="/">← Create anything</a><h1>Recent History</h1><p>View your recent generations across all models.</p></div><div class="history-tools">
      <label class="preview-switch">Show preview<input id="showPreview" type="checkbox" role="switch" checked><span aria-hidden="true"></span></label>
      <label class="sr-only" for="statusFilter">Status</label><select id="statusFilter"><option value="all">All statuses</option><option value="succeeded">Completed</option><option value="failed">Failed</option><option value="generating">Generating</option></select>
      <details class="source-picker" id="sourcePicker"><summary>Source <span id="sourceCount">2</span>⌄</summary><div><label><input type="checkbox" value="api_request" checked>API request</label><label><input type="checkbox" value="interface" checked>Interface</label></div></details>
      <div class="view-picker" aria-label="View"><button id="listView" type="button" aria-label="List view" aria-pressed="false">☷</button><button id="gridView" class="active" type="button" aria-label="Grid view" aria-pressed="true">▦</button></div>
    </div></header>
    <div class="history-subbar"><label class="search-field"><span aria-hidden="true">⌕</span><input id="historySearch" type="search" aria-label="Search history" placeholder="Search prompt or model…"></label><span id="historyCount" role="status">Loading history…</span><button class="refresh-button" id="refreshHistory" type="button">↻ Refresh</button></div>
    <div class="history-grid" id="historyGrid" aria-busy="true"></div>
    <section class="history-empty" id="historyEmpty" hidden><span>◷</span><h2 id="emptyTitle">No recent history yet</h2><p id="emptyDescription">Your generated results will appear here.</p><a href="/">Create something →</a></section>
    <button class="load-more" id="loadMore" hidden type="button">Load more</button>
  </main>
  <dialog id="historyDetail"><button class="detail-close" id="closeHistoryDetail" aria-label="Close details" type="button">×</button><div id="historyDetailContent"></div></dialog>
  <p class="history-toast" id="historyToast" role="status" hidden></p>
  <script type="module" src="/history.js"></script>
</body></html>
