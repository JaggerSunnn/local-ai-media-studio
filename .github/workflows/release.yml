name: Release package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Create ZIP
        run: cd dist && zip -r ../local-ai-media-studio-${GITHUB_REF_NAME}.zip local-ai-media-studio
      - name: Checksum
        run: sha256sum local-ai-media-studio-${GITHUB_REF_NAME}.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            local-ai-media-studio-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          generate_release_notes: true
