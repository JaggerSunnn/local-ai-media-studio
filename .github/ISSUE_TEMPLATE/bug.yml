name: Bug report
description: Report a reproducible product problem without sharing private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, private prompts, or customer media.
  - type: dropdown
    id: mode
    attributes:
      label: Product mode
      options: [Windows local, macOS local, Hosted PWA on iPhone/iPad, Hosted PWA on desktop, Developer mode]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include task or HTTP error codes only after removing credentials and private content.
