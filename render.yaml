services:
  - type: web
    name: local-ai-media-studio
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: LOCAL_STUDIO_DEPLOYMENT_MODE
        value: hosted
      - key: LOCAL_STUDIO_BASE_URL
        value: https://api.newportai.com
      - key: MAX_TASK_CREDITS
        value: 1000
